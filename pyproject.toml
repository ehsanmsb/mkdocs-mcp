[project]
name = "mkdocs-mcp"
version = "5.0.0"
description = "Generic, configurable MCP server that makes any MkDocs documentation site searchable and explorable from MCP clients."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastmcp>=4.1.4,<5",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "markdown-it-py>=3.0",
    "markdown>=3.6",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.29",
    "starlette>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mkdocs-mcp = "mkdocs_mcp.main:run"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocs_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
