name: Build and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --no-cache-dir uv
      - name: Install project
        run: uv pip install --system -e '.[dev]'
      - name: Lint and test
        run: |
          ruff check src tests
          ruff format --check src tests
          pytest -q
      - uses: azure/setup-helm@v4
      - name: Check Helm chart
        run: |
          helm lint charts/mkdocs-mcp
          helm template mkdocs-mcp charts/mkdocs-mcp -f charts/mkdocs-mcp/values-production.yaml > /dev/null
      - name: Check Docker build on pull requests
        if: github.event_name == 'pull_request'
        run: docker build --tag mkdocs-mcp:ci .

  release:
    name: Publish image and semantic release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.title=mkdocs-mcp
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install Python build tools
        run: python -m pip install --upgrade build
      - name: Publish semantic version and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          GIT_AUTHOR_NAME: ehsanmsb
          GIT_AUTHOR_EMAIL: ehsan.mosaieby@gmail.com
          GIT_COMMITTER_NAME: ehsanmsb
          GIT_COMMITTER_EMAIL: ehsan.mosaieby@gmail.com
        run: |
          npx --yes \
            -p semantic-release@25 \
            -p @semantic-release/commit-analyzer@13 \
            -p @semantic-release/release-notes-generator@14 \
            -p @semantic-release/exec@7 \
            -p @semantic-release/github@12 \
            -p conventional-changelog-conventionalcommits@8 \
            semantic-release
