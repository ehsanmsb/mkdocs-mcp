# Default values for mkdocs-mcp.
replicaCount: 1

image:
  repository: ghcr.io/ehsanmsb/mkdocs-mcp
  tag: ""              # defaults to the released chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- application configuration (-> ConfigMap, MKDOCS_MCP_* env) ---------------
config:
  serverName: MkDocs Docs                  # surfaced to MCP clients
  host: 0.0.0.0
  port: 8000
  sites:
    - name: docs
      base_url: https://docs.example.com
  reindexIntervalMinutes: 30
  rateLimitEnabled: true
  rateLimitPerSecond: 5
  rateLimitBurst: 20
  logLevel: INFO
  logJson: true
  metricsEnabled: true

service:
  type: ClusterIP
  port: 8000
  metricsPort: 9000

# Optional OpenShift Route. Enable it only on OpenShift.
route:
  enabled: false
  host: ""              # leave empty for an OpenShift-generated hostname
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Optional Kubernetes Ingress. Set host when enabling it.
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""     # leave empty when TLS terminates elsewhere

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  minAvailable: 1

serviceMonitor:
  enabled: false        # requires Prometheus Operator CRDs
  interval: 30s

networkPolicy:
  enabled: false
  ingressFrom: []

# OpenShift-friendly: do NOT pin runAsUser; let the SCC assign the UID.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
