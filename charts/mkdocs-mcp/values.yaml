# Default values for mkdocs-mcp.
replicaCount: 2

image:
  repository: ghcr.io/ehsanmsb/mkdocs-mcp
  tag: ""              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- application configuration (-> ConfigMap, MKDOCS_MCP_* env) ---------------
config:
  serverName: MkDocs Docs                  # surfaced to MCP clients
  host: 0.0.0.0
  port: 8000
  searchIndexUrl: ""                       # defaults to baseUrl/search/search_index.json
  baseUrl: https://docs.example.com
  reindexIntervalMinutes: 30
  rateLimitEnabled: true
  rateLimitPerSecond: 5
  rateLimitBurst: 20
  logLevel: INFO
  logJson: true
  metricsEnabled: true

service:
  type: ClusterIP
  port: 8000
  metricsPort: 9000

# OpenShift Route (preferred over Ingress on OKD).
route:
  enabled: true
  host: mkdocs-mcp.apps.example.com
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s

networkPolicy:
  enabled: true
  # CIDRs / selectors allowed to reach the MCP port (e.g. the ingress controller).
  ingressFrom: []

# OpenShift-friendly: do NOT pin runAsUser; let the SCC assign the UID.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
# Spread replicas across nodes for HA.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mkdocs-mcp
