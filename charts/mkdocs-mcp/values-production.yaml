replicaCount: 3

image:
  repository: ghcr.io/ehsanmsb/mkdocs-mcp

config:
  serverName: MkDocs Docs
  sourceMode: search_index
  searchIndexUrl: https://docs.example.com/search/search_index.json
  baseUrl: https://docs.example.com
  reindexIntervalMinutes: 30
  logLevel: INFO

route:
  host: docs-mcp.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6

podDisruptionBudget:
  enabled: true
  minAvailable: 2
