replicaCount: 3

image:
  repository: ghcr.io/ehsanmsb/mkdocs-mcp

config:
  serverName: MkDocs Docs
  sourceMode: git
  gitUrl: https://git.example.com/team/docs.git
  gitBranch: main
  gitUsername: oauth2
  mkdocsConfig: mkdocs.yml
  docsSubdir: docs
  baseUrl: https://docs.example.com
  repoWebUrl: https://git.example.com/team/docs
  editBranch: main
  reindexIntervalMinutes: 30
  logLevel: INFO

route:
  host: docs-mcp.example.com

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Set an external secret only when the docs repo needs a read-only Git token;
# do not commit that token to this file.
secrets:
  existingSecret: ""
