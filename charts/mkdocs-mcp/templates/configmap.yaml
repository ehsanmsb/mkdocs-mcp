apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mkdocs-mcp.fullname" . }}
  labels: {{- include "mkdocs-mcp.labels" . | nindent 4 }}
data:
  MKDOCS_MCP_HOST: "0.0.0.0"
  MKDOCS_MCP_PORT: "8000"
  MKDOCS_MCP_SOURCE_MODE: {{ .Values.config.sourceMode | quote }}
  MKDOCS_MCP_GIT_URL: {{ .Values.config.gitUrl | quote }}
  MKDOCS_MCP_GIT_BRANCH: {{ .Values.config.gitBranch | quote }}
  MKDOCS_MCP_GIT_USERNAME: {{ .Values.config.gitUsername | quote }}
  MKDOCS_MCP_MKDOCS_CONFIG: {{ .Values.config.mkdocsConfig | quote }}
  MKDOCS_MCP_DOCS_SUBDIR: {{ .Values.config.docsSubdir | quote }}
  MKDOCS_MCP_SEARCH_INDEX_URL: {{ .Values.config.searchIndexUrl | quote }}
  MKDOCS_MCP_BASE_URL: {{ .Values.config.baseUrl | quote }}
  MKDOCS_MCP_REPO_WEB_URL: {{ .Values.config.repoWebUrl | quote }}
  MKDOCS_MCP_EDIT_BRANCH: {{ .Values.config.editBranch | quote }}
  MKDOCS_MCP_REPO_DIR: "/data/repo"
  MKDOCS_MCP_SNAPSHOT_PATH: "/data/index-snapshot.json"
  MKDOCS_MCP_REINDEX_INTERVAL_MINUTES: {{ .Values.config.reindexIntervalMinutes | quote }}
  MKDOCS_MCP_EMBEDDINGS_ENABLED: {{ .Values.config.embeddingsEnabled | quote }}
  MKDOCS_MCP_EMBEDDINGS_MODEL: {{ .Values.config.embeddingsModel | quote }}
  MKDOCS_MCP_RATE_LIMIT_ENABLED: {{ .Values.config.rateLimitEnabled | quote }}
  MKDOCS_MCP_RATE_LIMIT_PER_SECOND: {{ .Values.config.rateLimitPerSecond | quote }}
  MKDOCS_MCP_RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  MKDOCS_MCP_SERVER_NAME: {{ .Values.config.serverName | quote }}
  MKDOCS_MCP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MKDOCS_MCP_LOG_JSON: {{ .Values.config.logJson | quote }}
  MKDOCS_MCP_METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
