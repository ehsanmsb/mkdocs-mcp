{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mkdocs-mcp.fullname" . }}
  labels: {{- include "mkdocs-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mkdocs-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: {{ .Values.config.port }}, protocol: TCP }
        {{- if .Values.config.metricsEnabled }}
        - { port: 9000, protocol: TCP }
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # Published MkDocs search index over HTTPS
    - ports:
        - { port: 443, protocol: TCP }
{{- end }}
