{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mkdocs-mcp.secretName" . }}
  labels: {{- include "mkdocs-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MKDOCS_MCP_AUTH_MODE: {{ .Values.secrets.authMode | quote }}
  MKDOCS_MCP_GIT_TOKEN: {{ .Values.secrets.gitToken | quote }}
  MKDOCS_MCP_BEARER_TOKENS: {{ .Values.secrets.bearerTokens | quote }}
  MKDOCS_MCP_ADMIN_TOKENS: {{ .Values.secrets.adminTokens | quote }}
{{- end }}
