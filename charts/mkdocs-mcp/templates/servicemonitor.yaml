{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mkdocs-mcp.fullname" . }}
  labels: {{- include "mkdocs-mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "mkdocs-mcp.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: /metrics
{{- end }}
