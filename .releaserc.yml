branches:
  - main

tagFormat: v${version}

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - breaking: true
          release: major
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: "*"
          release: patch
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Features
            hidden: false
          - type: fix
            section: Bug Fixes
            hidden: false
          - type: perf
            section: Performance
            hidden: false
          - type: refactor
            section: Refactoring
            hidden: false
          - type: docs
            hidden: true
          - type: test
            hidden: true
          - type: chore
            hidden: true
          - type: ci
            hidden: true
          - type: build
            hidden: true
          - type: style
            hidden: true
      writerOpts:
        commitsSort:
          - subject
          - scope
  - - "@semantic-release/exec"
    - prepareCmd: |
        set -eu
        version="${nextRelease.version}"

        python scripts/set_release_version.py "$version"
        rm -rf dist
        python -m build
        helm package charts/mkdocs-mcp --destination dist
        major_minor="$(printf '%s' "$version" | awk -F. '{print $1 "." $2}')"
        : "$IMAGE_NAME"
        docker buildx build --platform linux/amd64 --push \
          --tag "$IMAGE_NAME:$version" \
          --tag "$IMAGE_NAME:$major_minor" \
          --tag "$IMAGE_NAME:latest" \
          --tag "$IMAGE_NAME:main" \
          --label "org.opencontainers.image.version=$version" \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          .
  - - "@semantic-release/git"
    - assets:
        - charts/mkdocs-mcp/Chart.yaml
        - pyproject.toml
        - uv.lock
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - - "@semantic-release/github"
    - assets:
        - path: dist/*
